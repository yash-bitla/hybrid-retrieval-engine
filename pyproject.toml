[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-retrieval"
version = "0.1.0"
description = "BM25, dense retrieval and reranking with an evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
dense = ["sentence-transformers>=3"]
bench = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_retrieval"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "torch", "torch.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
